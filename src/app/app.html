<div class="app-container">
  <!-- Mobile Hamburger Menu -->
  <div class="mobile-header">
    <button class="hamburger-menu" (click)="toggleSidebar()" [class.open]="isSidebarOpen()">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <h1 class="app-title">Task Manager Pro</h1>
    <!-- DEBUG: Show state on mobile -->
    <div style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); color: lime; padding: 10px; font-size: 10px; border-radius: 5px; font-family: monospace; max-width: 200px; z-index: 9999; display: none;" class="mobile-only">
      isOpen: {{ isSidebarOpen() }}<br>
      currentView: {{ currentView() }}
    </div>
  </div>

  <app-sidebar
    [isOpen]="isSidebarOpen()"
    (viewChange)="changeView($event)"
    (toggleSidebar)="toggleSidebar()"
  />

  <main class="main-content" [class.sidebar-open]="isSidebarOpen()">
    <app-dashboard *ngIf="currentView() === 'dashboard'" />
    <app-calendar-view *ngIf="currentView() === 'calendar'" />
    <app-time-blocking *ngIf="currentView() === 'time-blocking'" />
    <app-focus-mode *ngIf="currentView() === 'focus'" />
    <app-statistics *ngIf="currentView() === 'statistics'" />
  </main>
</div>
