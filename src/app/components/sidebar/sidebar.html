<aside class="sidebar" [class.open]="isOpen">
  <div class="sidebar-header">
    <h2 class="sidebar-title">Task Manager Pro</h2>
    <button class="sidebar-toggle mobile-only" (click)="onToggleSidebar()">
      {{ isOpen ? '✕' : '☰' }}
    </button>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list">
      @for (item of menuItems; track item.id) {
        <li class="nav-item">
          <button
            class="nav-link"
            [class.active]="currentView === item.id"
            (click)="selectView(item.id)"
          >
            <span class="nav-icon">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
          </button>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button class="theme-toggle" (click)="toggleTheme()">
      <span class="theme-icon">{{ themeService.isDarkMode() ? '☀️' : '🌙' }}</span>
      <span class="theme-label">{{ themeService.isDarkMode() ? 'Light' : 'Dark' }} Mode</span>
    </button>
  </div>
</aside>

<div class="sidebar-backdrop mobile-only" [class.visible]="isOpen" (click)="onToggleSidebar()"></div>
